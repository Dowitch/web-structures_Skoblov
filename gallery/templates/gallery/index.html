<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>3D Storage</title>
</head>
<body>
    <header>
        <h1>{{ page_title }}</h1>
    </header>
   <main>
        <h2>Доступные ассеты:</h2>
        <!-- Цикл for в шаблоне Django -->
        <ul>
            {% for asset in assets %}
                <li>
                    <strong>{{ asset.title }}</strong>
                    <small>(Размер: {{ asset.file_size|filesizeformat }})</small>
                    <!-- Ссылка-заглушка -->
                    <a href="{{asset.file.url}}" download>[Скачать]</a>
                </li>
            {% empty %}
            <!-- Этот блок сработает, если список assets пустой -->
                <li>Нет доступных моделей.</li>
            {% endfor %}
        </ul>
        <a href="http://127.0.0.1:8000/about">[О нас]</a>
    </main>
    <footer>
        <p>&copy; 2024 Web Structures Course</p>
    </footer>
</body>
</html>

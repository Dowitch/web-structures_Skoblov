<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>New model upload</title>
</head>
<body>
    <h1>Загрузить новую модель</h1>

    <!-- Блок для отображения сообщений (Success, Error и т.д.) -->
    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <p style="color: green; font-weight: bold;">{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}
    
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            {{ form.as_p }}
        </div>
        <button type="submit">Отправить</button>
    </form>

    <br>
    <a href="{% url 'home' %}">Вернуться на главную</a>
</body>
</html>
